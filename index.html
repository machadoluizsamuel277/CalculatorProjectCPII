<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calculadora CPII</title>
    <link rel="stylesheet" href="bruh.css">
  </head>
  <body>
    <h2 id="titulo">Calculadora</h2>
    <div id="calc">
      <h1>calculadora</h1>
      <p id="resultado"></p>

      <table>
        <tr>
          <td><button type="button" onclick="clean()">C</button></td>
          <td><button type="button" onclick="back()">&#9003;</button></td>
          <td><button type="button" onclick="insert('&divide;')">&divide;</button></td>
          <td><button type="button" onclick="insert('&times;')">&times;</button></td>
        </tr>
        <tr>
          <td><button type="button" onclick="insert('7')">7</button></td>
          <td><button type="button" onclick="insert('8')">8</button></td>
          <td><button type="button" onclick="insert('9')">9</button></td>
          <td><button type="button" onclick="insert('-')">-</button></td>
        </tr>
        <tr>
          <td><button type="button" onclick="insert('4')">4</button></td>
          <td><button type="button" onclick="insert('5')">5</button></td>
          <td><button type="button" onclick="insert('6')">6</button></td>
          <td><button type="button" onclick="insert('+')" >+</button></td>
        </tr>
        <tr>
          <td><button type="button" onclick="insert('1')">1</button></td>
          <td><button type="button" onclick="insert('2')">2</button></td>
          <td><button type="button" onclick="insert('3')">3</button></td>
          <td rowspan="2"><button type="button" onclick="calcular()">=</button></td>
        </tr>
        <tr>
          <td colspan="2"><button type="button" onclick="insert('0')">0</button></td>
          <td><button type="button" onclick="insert('.')">.</button></td>

        </tr>
       
      </table>
    </div>
    <button id="muda-cor" >
    </button>

    
    <h3 id="nomes">Arthur e Luiz Samuel<br>
                        Ds-108
    </h3>
    <script src="script.js"></script>
  </body>
</html>
